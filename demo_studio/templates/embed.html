<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:type" content="video.other">
<meta property="og:image" content="{{base}}/media/{{slug}}/poster.jpg">
<meta property="og:video" content="{{base}}/media/{{slug}}/video.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="{{width}}">
<meta property="og:video:height" content="{{height}}">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #060b1f; }
  body { display: grid; place-items: center; font-family: "Segoe UI", system-ui, sans-serif; }
  video { width: 100vw; height: 100vh; max-width: 100%; object-fit: contain; background: #060b1f; display: block; }
</style>
</head>
<body>
<video controls playsinline preload="metadata" poster="/media/{{slug}}/poster.jpg">
  <source src="/media/{{slug}}/video.mp4" type="video/mp4">
  <track kind="captions" src="/media/{{slug}}/captions.vtt" srclang="en" label="English">
</video>
</body>
</html>
