# A starter walkthrough. Render it with:   studio render walkthrough.yaml
# Then point base_url at your own app and rewrite the steps. Reference: docs/storyboard-format.md
version: 1
name: tidy-tasks-tour               # the output folder: out/tidy-tasks-tour/
mode: public                        # public (made-up or seeded data) or handover (a client's real data, private)
title: "Plan a day in *Tidy Tasks*"      # *words* go on the highlight block
eyebrow: "DEMO STUDIO STARTER"
intro_note: "A made-up demo app. The waiting time is sped up."
intro:
  narration: "This is a short tour of a small demo app, made with demo studio."
  layout: auto                      # statement | product | agenda | cinematic | auto (picked from the name)
outro:
  heading: "That is the whole tour"
  bullets: ["Add a task in one line", "Plan my day puts what is due first"]
  narration: "That is it. Edit the storyboard to make a video of your own app."
  layout: auto                      # summary | cta | cinematic | auto

base_url: "http://localhost:5199"
serve: demo-app                     # serves this folder at base_url while recording; remove it for your own app
navigation: load                    # load, or spa for apps with client-side routes
auth: null                          # a saved session from `studio login <name>` for apps behind a sign-in
voice: auto                         # female | male | auto (varies by video) | a voice id such as af_heart or am_michael
viewport: [1440, 900]
sources:                            # where every claim in the narration comes from
  - "demo-app/index.html (made-up demo data)"
banned_terms: []                    # public mode: names and words that must never appear on screen
style:
  background: aurora                # one of 21 presets (`studio backgrounds`), a category such as blue, a list, auto, CSS or an image
  theme: petrol                     # slides and captions: petrol (dark) | kinetic (light) | navy
  captions: card                    # card | pill | lower
  music: ambient                    # a quiet pad made on your machine; remove for silence
  # subtitles: true                 # burn the narration in, for feeds that autoplay muted
  # canvas: [1080, 1080]            # a square video; `studio slides walkthrough.yaml` previews the looks
delivery: { public: true, private_link: false, expires: null, local_only: false }

steps:
  - id: list
    route: "/"
    action: wait_for
    target: "[data-demo=list]"
    caption: { n: 1, title: "Today's list", sub: "Four tasks, one due today" }
    narration: "Here is today's list. One task is due today."
  - id: type
    action: type
    target: "[data-demo=new-task]"
    text: "Book the team retro"
    zoom: auto                      # zoom in on the field before the cursor moves there
    caption: { n: 2, title: "Add a task", sub: "Type it in one line" }
    narration: "To add a task, type it in one line."
  - id: add
    action: click
    target: "[data-demo=add]"
    caption: { n: 3, title: "Save it", sub: "It joins the list" }
    narration: "Add puts it at the end of the list."
  - id: plan
    action: click
    target: "[data-demo=plan]"
    wait_for: "[data-demo=plan-result]"
    speed_up: true                  # the wait plays four times faster, and the caption says so
    caption: { n: 4, title: "Plan my day", sub: "The list is sorted for you" }
    narration: "Plan my day sorts the list. The wait is sped up, and the video says so."
  - id: result
    action: pause
    highlight: "[data-demo=plan-result]"
    zoom: 1.4
    hold: 0.6
    caption: { n: 5, title: "The plan", sub: "What is due comes first" }
    narration: "The plan starts with the invoices, because they are due today."
