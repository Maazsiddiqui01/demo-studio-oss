name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  smoke-render:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Cache the Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/demo-studio/models
          key: kokoro-onnx-v1.0
      - name: Install the browser and its system libraries
        run: python -m playwright install --with-deps chromium --only-shell
      - run: studio doctor
      - name: Render the hello example on the CPU
        run: studio render examples/hello/walkthrough.yaml --no-speech
      - name: Check the output
        run: |
          test -s out/hello-demo-studio/video.mp4
          test -s out/hello-demo-studio/captions.vtt
          grep -q "Text scan: \*\*PASS" out/hello-demo-studio/REPORT.md
          grep -q "File: \*\*PASS" out/hello-demo-studio/REPORT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hello-render
          path: |
            out/hello-demo-studio/video.mp4
            out/hello-demo-studio/REPORT.md
            out/hello-demo-studio/qa/sheets
